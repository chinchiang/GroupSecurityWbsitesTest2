version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - vitest
